name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:package
      - run: npm run build:demo
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Use Actions as the Pages publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const { data: site } = await github.rest.repos.getPages(context.repo);
            if (site.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({
                ...context.repo,
                build_type: 'workflow',
              });
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
